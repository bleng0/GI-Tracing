{% extends "base.html" %}
{% block content %}
<p>Newest first, last 200 entries.</p>
<table><tr><th>Time (UTC)</th><th>Event</th><th>User</th><th>Detail</th></tr>
{% for r in rows %}<tr><td>{{ r.ts }}</td><td>{{ r.event }}</td><td>{{ r.username or "(unknown name)" }}</td><td>{{ r.detail }}</td></tr>{% endfor %}
</table>
{% endblock %}
