services:
  web:
    build: .
    image: gi-craft-tracing-web
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - path: .env
        required: true
    environment:
      GI_DOCKER: 1
      GI_MODE: atlas
    volumes:
      - ./accounts:/app/accounts
      - ./data:/app/data
      - ./out:/app/out
    restart: unless-stopped
